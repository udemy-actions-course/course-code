name: Express and Context
on: [push, pull_request, issues, workflow_dispatch]
run-name: "Express and Context by @${{github.actor}}, event: ${{github.event_name}}"

jobs:
  express-and-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        id: expressions
        run: |
          echo ${{1}}
          echo "This is a test of expressions and context in GitHub Actions."
          echo "null"
          echo "true"
          echo "false"
          echo "1>2"
          echo ${{'string' == 'string'}}
      - name: Dump context
        run: |
          echo '${{ toJson(github) }}'
          echo '${{ toJson(env) }}'
          echo '${{ toJson(secrets) }}'
          echo '${{ toJson(matrix) }}'
          echo '${{ toJson(job) }}'
